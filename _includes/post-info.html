<div class="post_info">
  {%- if include.author -%}
    <span>
      <i class="fas fa-feather-alt"></i>
      {%- if include.member -%}
      <a href="{{ include.member | prepend: 'members/' | relative_url }}">
      {%- endif -%}
        {{- include.author -}}
      {%- if include.member -%}
      </a>
      {%- endif -%}
    </span>
  {%- endif -%}

</div>

{%- if include.tags -%}
  {% include tags.html tags=include.tags link="blog" %}
{%- endif -%}
